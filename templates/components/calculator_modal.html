{% load static %}
<!-- On-Screen Scientific Calculator Modal (Casio fx-991ES Plus Natural Textbook Display Standard) -->
<div id="scientific-calculator-modal"
     class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/65 backdrop-blur-sm hidden p-0 sm:p-4 transition-opacity select-none"
     role="dialog" aria-modal="true" aria-label="Casio Scientific Calculator" aria-hidden="true">
  
  <!-- Backdrop click to close (does not touch the exam) -->
  <div class="fixed inset-0" onclick="useKalmiStore.getState().closeCalc()" aria-hidden="true"></div>

  <!-- Calculator Window Chassis (Casio fx-991 Curved Titanium Card) -->
  <div class="calc-window relative z-10 w-full sm:max-w-md bg-slate-900 border-t sm:border border-slate-700/80 rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] select-none text-slate-100"
       style="max-width: 440px; width: 100%;">
    
    <!-- Casio Top Bezel with Branding & Solar Cell Panel -->
    <div class="casio-top-bezel flex items-center justify-between px-4 py-2.5 border-b border-slate-700/60">
      <div class="flex items-center gap-2">
        <span class="casio-brand-title font-sans">CASIO</span>
        <span class="casio-vpam-badge font-mono">NATURAL-V.P.A.M.</span>
        <span class="casio-model-code font-mono hidden xs:inline">fx-991ES PLUS</span>
      </div>

      <div class="flex items-center gap-2.5">
        <!-- Two-Way Power Solar Cell Strip Graphic -->
        <div class="casio-solar-strip hidden xs:flex items-center" title="Two-Way Power Solar Strip">
          <div class="casio-solar-cell"></div>
          <div class="casio-solar-cell"></div>
          <div class="casio-solar-cell"></div>
          <div class="casio-solar-cell"></div>
        </div>

        <!-- Angle Mode Toggle (DEG / RAD) -->
        <button type="button" 
                id="calc-angle-mode-btn" 
                onclick="useKalmiStore.getState().setCalcAngleMode(useKalmiStore.getState().calc.angleMode === 'DEG' ? 'RAD' : 'DEG')" 
                class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-slate-800 hover:bg-slate-700 text-brand-400 border border-slate-700 transition-colors"
                title="Toggle Degrees / Radians">
          DEG
        </button>

        <!-- Close Button -->
        <button type="button" 
                onclick="useKalmiStore.getState().closeCalc()" 
                class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                aria-label="Close Calculator (Esc or Alt+C)"
                title="Close (Esc or Alt+C)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Section: Casio Natural Display Framed Screen Inset -->
    <div class="p-2.5 bg-slate-950/90 border-b border-slate-800 select-none">
      <div class="casio-lcd-screen px-3.5 py-2.5 select-none flex flex-col justify-between"
           style="min-height: 122px;">
        
        <!-- Annunciators & Status Row -->
        <div class="casio-lcd-status flex items-center justify-between mb-1 pb-1 font-mono">
          <div class="flex items-center gap-1.5 font-bold uppercase tracking-wider text-[9px]">
            <span id="calc-m-badge" class="casio-lcd-badge">D</span>
            <span id="calc-memory-indicator" class="casio-lcd-badge hidden">M</span>
            <span id="calc-math-badge" class="casio-lcd-badge font-serif italic">Math</span>
            <span id="calc-ans-indicator" class="casio-lcd-badge hidden">Ans</span>
            <span id="calc-sd-indicator" class="casio-lcd-badge casio-lcd-badge-amber hidden">S⇔D</span>
          </div>
          <div class="text-[9px] font-sans font-bold tracking-wider" style="color: #334155;">NATURAL-V.P.A.M.</div>
        </div>

        <!-- Line 1: Primary Natural Textbook Expression Area (Large, Spacious Casio Display) -->
        <div id="calc-expression-display" 
             class="w-full overflow-x-auto no-scrollbar whitespace-nowrap min-h-[58px] flex items-center justify-start text-left cursor-text"
             style="direction: ltr;">
          <math-field id="calc-math-field" 
                      math-virtual-keyboard-policy="manual"
                      class="w-full bg-transparent border-none outline-none" 
                      aria-label="Mathematical Input Field">
          </math-field>
          <span id="calc-text-mirror" class="sr-only">0</span>
        </div>

        <!-- Line 2: Precision Result (Right-aligned Bottom Baseline) -->
        <div id="calc-result-display" 
             class="casio-lcd-result text-xl sm:text-2xl font-bold font-mono text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight min-h-[32px] flex items-center justify-end pt-1">
          0
        </div>
      </div>
    </div>

    <!-- Section: Dedicated LaTeX Conversion Panel -->
    <div class="px-3.5 py-1.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between gap-2 text-xs select-none">
      <div class="flex items-center gap-1.5 overflow-hidden min-w-0 pr-2">
        <span class="text-[8px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-brand-500/15 text-brand-400 border border-brand-500/30 shrink-0 font-mono">
          LaTeX
        </span>
        <code id="calc-latex-code" class="truncate font-mono text-[11px] text-slate-300 font-semibold select-all" title="Current LaTeX Expression">
          0
        </code>
      </div>
      <button type="button" 
              id="calc-copy-latex-btn"
              onclick="KalmiCalc.copyLatex()" 
              class="shrink-0 px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center gap-1 transition-all"
              title="Copy LaTeX formula">
        <i data-lucide="copy" class="w-3 h-3 text-slate-400"></i>
        <span>Copy</span>
      </button>
    </div>

    <!-- Casio REPLAY 4-Way Directional Navigation Deck -->
    <div class="casio-nav-deck select-none"
         onmousedown="event.preventDefault()">
      
      <!-- Left Wing: Quick Grouping Keys -->
      <div class="casio-wing-group justify-start">
        <button type="button" 
                onclick="useKalmiStore.getState().appendCalc('(')" 
                class="casio-aux-btn text-amber-300"
                title="Open Parenthesis (">
          (
        </button>
        <button type="button" 
                onclick="useKalmiStore.getState().appendCalc(')')" 
                class="casio-aux-btn text-amber-300"
                title="Close Parenthesis )">
          )
        </button>
      </div>

      <!-- Center: Sculpted 4-Way Segmented D-Pad Rocker -->
      <div class="casio-dpad" role="group" aria-label="4-Way Cursor Navigation Pad">
        <!-- LEFT Button (◄) -->
        <button type="button" 
                id="calc-nav-left"
                onclick="KalmiCalc.navLeft()" 
                class="casio-dpad-btn dpad-left"
                aria-label="Cursor Left"
                title="Move Cursor Left (ArrowLeft)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>

        <!-- UP Button (▲) -->
        <button type="button" 
                id="calc-nav-up"
                onclick="KalmiCalc.navUp()" 
                class="casio-dpad-btn dpad-up"
                aria-label="Cursor Up / History Previous"
                title="Move Cursor Up (ArrowUp)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>

        <!-- DOWN Button (▼) -->
        <button type="button" 
                id="calc-nav-down"
                onclick="KalmiCalc.navDown()" 
                class="casio-dpad-btn dpad-down"
                aria-label="Cursor Down / History Next"
                title="Move Cursor Down (ArrowDown)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <!-- RIGHT Button (►) -->
        <button type="button" 
                id="calc-nav-right"
                onclick="KalmiCalc.navRight()" 
                class="casio-dpad-btn dpad-right"
                aria-label="Cursor Right"
                title="Move Cursor Right (ArrowRight)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <!-- Right Wing: Mode & S⇔D Quick Actions -->
      <div class="casio-wing-group justify-end">
        <button type="button" 
                onclick="useKalmiStore.getState().toggleCalcFraction()" 
                class="casio-aux-btn casio-aux-amber"
                title="Toggle Fraction / Decimal (S⇔D)">
          S&hArr;D
        </button>
        <button type="button" 
                id="calc-nav-mode-btn" 
                onclick="useKalmiStore.getState().toggleCalcAngleMode()" 
                class="casio-aux-btn casio-aux-sky"
                title="Toggle Angle Mode (DEG / RAD)">
          MODE
        </button>
      </div>

    </div>

    <!-- Casio Tactile Keypad (Dual-Tone Accessible Touch Targets) -->
    <div class="p-2.5 sm:p-3 grid grid-cols-6 gap-1.5 text-xs font-semibold select-none bg-slate-900/95 overflow-y-auto"
         onmousedown="event.preventDefault()">
      
      <!-- Row 1: Memory & Clear Row -->
      <button type="button" onclick="useKalmiStore.getState().memoryClear()" class="casio-fn-btn" title="Memory Clear">MC</button>
      <button type="button" onclick="useKalmiStore.getState().memoryRecall()" class="casio-fn-btn" title="Memory Recall">MR</button>
      <button type="button" onclick="useKalmiStore.getState().memorySubtract()" class="casio-fn-btn" title="Memory Subtract">M&minus;</button>
      <button type="button" onclick="useKalmiStore.getState().memoryAdd()" class="casio-fn-btn" title="Memory Add">M+</button>
      <button type="button" onclick="useKalmiStore.getState().backspaceCalc()" class="casio-del-btn" title="Backspace (DEL)">DEL</button>
      <button type="button" onclick="useKalmiStore.getState().clearCalc()" class="casio-ac-btn" title="All Clear (AC)">AC</button>

      <!-- Row 2: Scientific Functions & Roots -->
      <button type="button" onclick="KalmiCalc.insertTemplate('fraction')" class="casio-fn-btn font-mono" title="Stacked Fraction (■/□)">&#9632;/&#9633;</button>
      <button type="button" onclick="KalmiCalc.insertTemplate('sqrt')" class="casio-fn-btn font-mono" title="Square Root (&radic;&Box;)">&radic;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('^2')" class="casio-fn-btn font-mono" title="Square (x²)">x&sup2;</button>
      <button type="button" onclick="KalmiCalc.insertTemplate('power')" class="casio-fn-btn font-mono" title="Power (x^&Box;)">x&#739;</button>
      <button type="button" onclick="KalmiCalc.insertTemplate('logbase')" class="casio-fn-btn font-mono text-[10px]" title="Logarithm with Base (log_b(x))">log&#9633;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('ln(')" class="casio-fn-btn font-mono" title="Natural Logarithm (ln)">ln</button>

      <!-- Row 3: Nth Root, Negative & Trigonometry -->
      <button type="button" onclick="KalmiCalc.insertTemplate('nthroot')" class="casio-fn-btn font-mono text-[10px]" title="General Nth Root (ʸ&radic;x)">&#739;&radic;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('log(')" class="casio-fn-btn font-mono" title="Common Logarithm (log10)">log</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&minus;')" class="casio-fn-btn font-mono" title="Negative Sign (-)">(-)</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('sin(')" class="casio-fn-btn font-mono">sin</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('cos(')" class="casio-fn-btn font-mono">cos</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('tan(')" class="casio-fn-btn font-mono">tan</button>

      <!-- Row 4: Absolute Value, Parentheses, S<=>D & Combinatorics -->
      <button type="button" onclick="KalmiCalc.insertTemplate('abs')" class="casio-fn-btn font-mono text-[11px]" title="Absolute Value (|x|)">|x|</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('(')" class="casio-fn-btn font-bold text-sm">(</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc(')')" class="casio-fn-btn font-bold text-sm">)</button>
      <button type="button" id="calc-sd-btn" onclick="useKalmiStore.getState().toggleCalcFraction()" class="casio-fn-btn casio-aux-amber font-mono text-[11px] font-bold" title="Toggle Fraction / Decimal (S<=>D)">S&hArr;D</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('nPr')" class="casio-fn-btn font-mono text-[11px]" title="Permutations (nPr)">nPr</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&divide;')" class="casio-op-btn" title="Division (&divide;)">&divide;</button>

      <!-- Row 5: Digits 7, 8, 9, Factorial, Combinations & Multiplication -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('7')" class="casio-digit-btn">7</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('8')" class="casio-digit-btn">8</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('9')" class="casio-digit-btn">9</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('!')" class="casio-fn-btn font-mono" title="Factorial (n!)">n!</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('nCr')" class="casio-fn-btn font-mono text-[11px]" title="Combinations (nCr)">nCr</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&times;')" class="casio-op-btn" title="Multiplication (&times;)">&times;</button>

      <!-- Row 6: Digits 4, 5, 6, Percent, Pi & Subtraction -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('4')" class="casio-digit-btn">4</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('5')" class="casio-digit-btn">5</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('6')" class="casio-digit-btn">6</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('%')" class="casio-fn-btn font-mono" title="Percent (%)">%</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&pi;')" class="casio-fn-btn font-mono text-purple-400">&pi;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&minus;')" class="casio-op-btn" title="Subtraction (&minus;)">&minus;</button>

      <!-- Row 7: Digits 1, 2, 3 & Addition -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('1')" class="casio-digit-btn">1</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('2')" class="casio-digit-btn">2</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('3')" class="casio-digit-btn">3</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('e')" class="casio-fn-btn font-mono text-purple-400">e</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('EXP')" class="casio-fn-btn font-mono text-[10px]" title="Scientific Exponential (e.g. 1.6 &times; 10^-19)">EXP</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('+')" class="casio-op-btn" title="Addition (+)">+</button>

      <!-- Row 8: Digit 0, Dot, Ans & Equals -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('0')" class="casio-digit-btn col-span-2 text-left px-4">0</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('.')" class="casio-digit-btn font-bold text-base">.</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('Ans')" class="casio-fn-btn font-mono font-bold" title="Previous Answer">Ans</button>
      <button type="button" onclick="useKalmiStore.getState().evaluateCalc(true)" class="casio-equal-btn col-span-2" title="Equals (=)">=</button>

    </div>
  </div>
</div>

<style>
  /* Casio Top Bezel & Solar Cell Panel */
  .casio-top-bezel {
    background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
  }
  .casio-brand-title {
    font-weight: 900;
    letter-spacing: 0.14em;
    font-size: 0.85rem;
    color: #f8fafc;
  }
  .casio-vpam-badge {
    font-size: 9px;
    font-weight: 700;
    color: #fbbf24;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 4px;
    background-color: rgba(2, 6, 23, 0.75);
    border: 1px solid rgba(51, 65, 85, 0.8);
  }
  .casio-model-code {
    font-size: 9px;
    font-style: italic;
    font-weight: 600;
    color: #94a3b8;
  }
  .casio-solar-strip {
    height: 18px;
    width: 54px;
    border-radius: 4px;
    background-color: #261710;
    border: 1px solid #475569;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  .casio-solar-cell {
    flex: 1;
    height: 100%;
    border-right: 1px solid rgba(120, 53, 15, 0.45);
  }
  .casio-solar-cell:last-child {
    border-right: none;
  }

  /* Casio Framed Natural Textbook LCD Screen */
  .casio-lcd-screen {
    background: linear-gradient(180deg, #cadac2 0%, #bfd2b6 100%) !important;
    color: #0f172a !important;
    border: 2px solid #334155;
    border-radius: 0.75rem;
    box-shadow: inset 0 3px 6px rgba(15, 23, 42, 0.28);
  }
  .casio-lcd-status {
    border-bottom: 1px solid rgba(15, 23, 42, 0.14);
  }
  .casio-lcd-badge {
    padding: 1px 4px;
    border-radius: 3px;
    background-color: rgba(15, 23, 42, 0.12);
    color: #0f172a;
    font-size: 9px;
    font-weight: 700;
  }
  .casio-lcd-badge-amber {
    background-color: rgba(120, 53, 15, 0.18);
    color: #451a03;
  }
  .casio-lcd-result {
    color: #0f172a !important;
    border-top: 1px solid rgba(15, 23, 42, 0.14);
  }

  /* Casio REPLAY 4-Way Directional Navigation Deck */
  .casio-nav-deck {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.75rem;
    background: linear-gradient(180deg, #0f172a 0%, #090d16 100%);
    border-bottom: 1px solid #1e293b;
  }
  .casio-wing-group {
    display: flex;
    align-items: center;
    gap: 0.375rem;
  }
  .casio-aux-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
    height: 36px;
    padding: 0 0.5rem;
    border-radius: 0.5rem;
    background: linear-gradient(180deg, #263349 0%, #1e293b 100%);
    border: 1px solid #475569;
    color: #fcd34d;
    box-shadow: 0 2px 0 0 #020617;
    font-family: monospace;
    font-size: 0.75rem;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
    transition: all 0.06s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-aux-amber {
    color: #fbbf24 !important;
  }
  .casio-aux-sky {
    color: #38bdf8 !important;
  }
  .casio-aux-btn:hover {
    background: linear-gradient(180deg, #334155 0%, #263349 100%);
    border-color: #64748b;
    filter: brightness(1.08);
  }
  .casio-aux-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #020617;
  }

  /* Sculpted 4-Way Segmented D-Pad Rocker */
  .casio-dpad {
    display: grid;
    grid-template-columns: 42px 50px 42px;
    grid-template-rows: 26px 26px;
    gap: 3px;
    padding: 4px;
    border-radius: 9999px;
    background: #050811;
    border: 1.5px solid #334155;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85), 0 1px 2px rgba(255, 255, 255, 0.05);
  }
  .casio-dpad-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
    border: 1px solid #475569;
    color: #e2e8f0;
    box-shadow: 0 1px 0 0 #020617;
    cursor: pointer;
    user-select: none;
    transition: all 0.06s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-dpad-btn:hover {
    background: linear-gradient(180deg, #475569 0%, #334155 100%);
    border-color: #60a5fa;
    color: #ffffff;
  }
  .casio-dpad-btn:active {
    transform: translateY(1px);
    background: #1e293b;
    box-shadow: none;
  }
  .casio-dpad-btn.dpad-left {
    grid-column: 1;
    grid-row: 1 / span 2;
    border-radius: 9999px 6px 6px 9999px;
    padding-right: 2px;
  }
  .casio-dpad-btn.dpad-up {
    grid-column: 2;
    grid-row: 1;
    border-radius: 8px 8px 3px 3px;
  }
  .casio-dpad-btn.dpad-down {
    grid-column: 2;
    grid-row: 2;
    border-radius: 3px 3px 8px 8px;
  }
  .casio-dpad-btn.dpad-right {
    grid-column: 3;
    grid-row: 1 / span 2;
    border-radius: 6px 9999px 9999px 6px;
    padding-left: 2px;
  }

  /* Casio fx-991 Style Tactile Keypad Styling */
  .casio-fn-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 38px;
    border-radius: 0.5rem;
    background-color: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    box-shadow: 0 2px 0 0 #0f172a;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-fn-btn:hover {
    background-color: #334155;
    color: #ffffff;
  }
  .casio-fn-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #0f172a;
  }

  .casio-digit-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 40px;
    border-radius: 0.5rem;
    background-color: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    font-weight: 800;
    font-family: monospace;
    font-size: 1.15rem;
    box-shadow: 0 2px 0 0 #94a3b8;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
