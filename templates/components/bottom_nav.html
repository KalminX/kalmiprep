{% load static %}
<!-- Mobile Fixed Bottom Navigation Bar with Clean Highlight (Border & Background) -->
<nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-navy-900/95 backdrop-blur-md border-t border-slate-200 dark:border-navy-800 transition-colors shadow-lg pb-[max(0.25rem,env(safe-area-inset-bottom))]"
     id="mobile-bottom-nav">
  <div class="max-w-lg mx-auto h-16 px-2 flex items-center justify-around relative" id="bottom-nav-container">
    
    <!-- 1. Home -->
    <a href="{% url 'core:landing' %}" 
       data-nav="core"
       hx-boost="true" 
       hx-target="#main-content" 
       hx-select="#main-content" 
       hx-swap="innerHTML show:window:top" 
       hx-push-url="true"
       class="mobile-nav-item flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-all duration-150 {% if request.path == '/' %}bg-brand-50/80 dark:bg-navy-800 text-brand-600 dark:text-brand-400 font-bold border border-brand-200/90 dark:border-navy-700 shadow-sm{% else %}text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-white border border-transparent{% endif %}">
      <i data-lucide="home" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px] tracking-tight">Home</span>
    </a>

    <!-- 2. Subjects Explorer -->
    <a href="{% url 'curriculum:subject_list' %}" 
       data-nav="curriculum"
       hx-boost="true" 
       hx-target="#main-content" 
       hx-select="#main-content" 
       hx-swap="innerHTML show:window:top" 
       hx-push-url="true"
       class="mobile-nav-item flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-all duration-150 {% if '/curriculum/' in request.path %}bg-brand-50/80 dark:bg-navy-800 text-brand-600 dark:text-brand-400 font-bold border border-brand-200/90 dark:border-navy-700 shadow-sm{% else %}text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-white border border-transparent{% endif %}">
      <i data-lucide="book-open" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px] tracking-tight">Syllabus</span>
    </a>

    <!-- 3. Practice & CBT (Elevated Action Button) -->
    <a href="{% url 'practice:setup' %}" 
       data-nav="practice"
       hx-boost="true" 
       hx-target="#main-content" 
       hx-select="#main-content" 
       hx-swap="innerHTML show:window:top" 
       hx-push-url="true"
       class="mobile-nav-item flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition-all duration-150 active:scale-95 -mt-3 {% if '/practice/' in request.path %}border border-brand-300 dark:border-brand-500/50 bg-brand-50/70 dark:bg-navy-800 ring-2 ring-brand-500/20{% else %}border border-transparent{% endif %}">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-700 via-brand-600 to-emerald-400 text-white flex items-center justify-center shadow-md shadow-brand-600/30">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <span class="text-[10px] tracking-tight font-bold text-slate-800 dark:text-slate-200 mt-0.5">Practise</span>
    </a>

    <!-- 4. Questions Library -->
    <a href="{% url 'questions:question_list' %}" 
       data-nav="questions"
       hx-boost="true" 
       hx-target="#main-content" 
       hx-select="#main-content" 
       hx-swap="innerHTML show:window:top" 
       hx-push-url="true"
       class="mobile-nav-item flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-all duration-150 {% if '/questions/' in request.path %}bg-brand-50/80 dark:bg-navy-800 text-brand-600 dark:text-brand-400 font-bold border border-brand-200/90 dark:border-navy-700 shadow-sm{% else %}text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-white border border-transparent{% endif %}">
      <i data-lucide="layers" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px] tracking-tight">Library</span>
    </a>

    <!-- 5. Student Dashboard / Progress -->
    <a href="{% url 'progress:dashboard' %}" 
       data-nav="progress"
       hx-boost="true" 
       hx-target="#main-content" 
       hx-select="#main-content" 
       hx-swap="innerHTML show:window:top" 
       hx-push-url="true"
       class="mobile-nav-item flex flex-col items-center justify-center py-1.5 px-3 rounded-xl transition-all duration-150 relative {% if '/progress/' in request.path %}bg-brand-50/80 dark:bg-navy-800 text-brand-600 dark:text-brand-400 font-bold border border-brand-200/90 dark:border-navy-700 shadow-sm{% else %}text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-white border border-transparent{% endif %}">
      <i data-lucide="pie-chart" class="w-5 h-5 mb-0.5"></i>
      <span class="text-[10px] tracking-tight">Progress</span>
      {% if global_bookmark_count > 0 %}
      <span class="absolute top-1.5 right-2 w-2 h-2 rounded-full bg-amber-500"></span>
      {% endif %}
    </a>

  </div>
</nav>
