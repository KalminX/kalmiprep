services:
  redis:
    image: redis:7-alpine
    container_name: kalmiprep-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - webproxy
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: kalmiprep-app
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://kalmiprep_user:kalmiprep_secure_pass_2026@postgres-db:5432/kalmiprep_db
      - REDIS_URL=redis://kalmiprep-redis:6379/1
      - DEBUG=False
      - ALLOWED_HOSTS=kalmiprep.kalmitech.app,localhost,127.0.0.1,kalmiprep-app
      - CSRF_TRUSTED_ORIGINS=https://kalmiprep.kalmitech.app
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./templates:/app/templates
      - ./core:/app/core
      - ./curriculum:/app/curriculum
      - ./questions:/app/questions
      - ./practice:/app/practice
      - ./progress:/app/progress
      - ./accounts:/app/accounts
      - /home/kalmin/startups/myschool-past-questions-scraper/myschool_dataset:/app/myschool_dataset:ro
    networks:
      - webproxy

volumes:
  redis_data:

networks:
  webproxy:
    external: true
