{% load static %}
<!-- On-Screen Scientific Calculator Modal (JAMB UTME / WAEC CBT Standard) -->
<div id="scientific-calculator-modal"
     class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-sm hidden p-0 sm:p-4 transition-opacity select-none"
     role="dialog" aria-modal="true" aria-label="Scientific calculator" aria-hidden="true">
  
  <!-- Backdrop click to close (does not touch the exam) -->
  <div class="fixed inset-0" onclick="useKalmiStore.getState().closeCalc()" aria-hidden="true"></div>

  <!-- Calculator Window Card (Solid Accessible Modal) -->
  <div class="calc-window relative z-10 w-full sm:max-w-md bg-white dark:bg-navy-900 border-t sm:border border-slate-200 dark:border-navy-700 rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] select-none"
       style="max-width: 440px; width: 100%;">
    
    <!-- Header Bar with Title, Angle Mode & Close -->
    <div class="flex items-center justify-between px-4 py-3 bg-slate-50 dark:bg-navy-950 border-b border-slate-200 dark:border-navy-800">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-brand-600 text-white flex items-center justify-center text-xs font-bold shadow-sm">
          <i data-lucide="calculator" class="w-4 h-4"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white leading-tight">Scientific Calculator</span>
          <span class="text-[10px] text-slate-500 dark:text-slate-400 font-mono">JAMB &middot; WAEC Standard</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" 
                id="calc-angle-mode-btn" 
                onclick="useKalmiStore.getState().setCalcAngleMode(useKalmiStore.getState().calc.angleMode === 'DEG' ? 'RAD' : 'DEG')" 
                class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold bg-slate-200 dark:bg-navy-800 text-brand-700 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-navy-700 border border-slate-300 dark:border-navy-700 transition-colors"
                title="Toggle Degrees / Radians">
          DEG
        </button>
        <button type="button" 
                onclick="useKalmiStore.getState().closeCalc()" 
                class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-navy-800 transition-colors"
                aria-label="Close Calculator (Esc or Alt+C)"
                title="Close (Esc or Alt+C)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- LCD Display -->
    <div class="p-3.5 bg-slate-900 border-b border-slate-800 text-slate-100 space-y-1">
      <div class="flex items-center justify-between text-xs text-slate-400 font-mono">
        <div class="flex items-center gap-1.5">
          <span id="calc-memory-indicator" class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-bold hidden text-[10px]">M</span>
          <span id="calc-ans-indicator" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-bold hidden text-[10px]">Ans</span>
        </div>
        <div id="calc-expression-display" class="w-full text-right overflow-x-auto no-scrollbar whitespace-nowrap text-slate-400 font-mono text-xs min-h-[18px]">
          0
        </div>
      </div>
      <div id="calc-result-display" class="text-2xl sm:text-3xl font-bold font-mono text-emerald-400 text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight min-h-[38px]">
        0
      </div>
    </div>

    <!-- Scientific Keypad Grid (Solid, Accessible Touch Targets) -->
    <div class="p-3 grid grid-cols-6 gap-1.5 sm:gap-2 text-xs font-semibold select-none bg-slate-50/50 dark:bg-navy-900 overflow-y-auto">
      
      <!-- Row 1: Memory & Clear -->
      <button type="button" onclick="useKalmiStore.getState().memoryClear()" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800" title="Memory Clear">MC</button>
      <button type="button" onclick="useKalmiStore.getState().memoryRecall()" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800" title="Memory Recall">MR</button>
      <button type="button" onclick="useKalmiStore.getState().memorySubtract()" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800" title="Memory Subtract">M&minus;</button>
      <button type="button" onclick="useKalmiStore.getState().memoryAdd()" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800" title="Memory Add">M+</button>
      <button type="button" onclick="useKalmiStore.getState().backspaceCalc()" class="calc-btn text-amber-600 dark:text-amber-400 bg-white dark:bg-navy-800 font-bold flex items-center justify-center" title="Backspace (DEL)">
        <i data-lucide="delete" class="w-4 h-4"></i>
      </button>
      <button type="button" onclick="useKalmiStore.getState().clearCalc()" class="calc-btn text-rose-600 dark:text-rose-400 bg-white dark:bg-navy-800 font-bold" title="All Clear (AC)">C</button>

      <!-- Row 2: Trig & Logarithms -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('sin(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">sin</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('cos(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">cos</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('tan(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">tan</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('ln(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">ln</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('log(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">log</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('sqrt(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">&radic;</button>

      <!-- Row 3: Inverse Trig & Roots -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('asin(')" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800 font-mono text-[11px]">sin&minus;&sup1;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('acos(')" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800 font-mono text-[11px]">cos&minus;&sup1;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('atan(')" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800 font-mono text-[11px]">tan&minus;&sup1;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('^(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">xʸ</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('(')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-sm">(</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc(')')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-sm">)</button>

      <!-- Row 4: Digits 7,8,9 & Division -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('cbrt(')" class="calc-btn text-slate-600 dark:text-slate-400 bg-white dark:bg-navy-800 font-mono text-[11px]">&xcup;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&divide;')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-base">&divide;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('7')" class="calc-btn-digit">7</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('8')" class="calc-btn-digit">8</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('9')" class="calc-btn-digit">9</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&minus;')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-base">&minus;</button>

      <!-- Row 5: Square, Powers & Digits 4,5,6 -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('^2')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">x&sup2;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('10^(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">10&#739;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('4')" class="calc-btn-digit">4</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('5')" class="calc-btn-digit">5</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('6')" class="calc-btn-digit">6</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('+')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-base">+</button>

      <!-- Row 6: Constants, Digits 1,2,3 & Multiplication -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&pi;')" class="calc-btn text-purple-600 dark:text-purple-400 bg-white dark:bg-navy-800 font-mono">&pi;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('e')" class="calc-btn text-purple-600 dark:text-purple-400 bg-white dark:bg-navy-800 font-mono">e</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('1')" class="calc-btn-digit">1</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('2')" class="calc-btn-digit">2</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('3')" class="calc-btn-digit">3</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&times;')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-base">&times;</button>

      <!-- Row 7: Factorial, EXP, %, 0, Dot, Equals -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('!')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">n!</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('EXP')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono" title="Scientific Exponential (e.g. 1.6 &times; 10^-19)">EXP</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('%')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">%</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('0')" class="calc-btn-digit">0</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('.')" class="calc-btn-digit font-bold text-base">.</button>
      <button type="button" onclick="useKalmiStore.getState().evaluateCalc(true)" class="calc-btn bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white font-bold text-lg shadow-md shadow-brand-600/30 flex items-center justify-center" title="Equals (=)">=</button>

    </div>
  </div>
</div>

<style>
  .calc-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.65rem 0.25rem;
    min-height: 42px;
    border-radius: 0.75rem;
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 0.08s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dark .calc-btn {
    border-color: rgba(30, 41, 59, 0.9);
  }
  .calc-btn:hover {
    filter: brightness(0.97);
  }
  .dark .calc-btn:hover {
    filter: brightness(1.1);
  }
  .calc-btn:active {
    transform: scale(0.95);
  }
  .calc-btn-digit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.65rem 0.25rem;
    min-height: 42px;
    border-radius: 0.75rem;
    border: 1px solid rgba(226, 232, 240, 0.9);
    background-color: #ffffff;
    color: #0f172a;
    font-weight: 700;
    font-family: monospace;
    font-size: 1.1rem;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 0.08s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dark .calc-btn-digit {
    background-color: #1e293b;
    border-color: rgba(51, 65, 85, 0.9);
    color: #f8fafc;
  }
  .calc-btn-digit:hover {
    background-color: #f8fafc;
  }
  .dark .calc-btn-digit:hover {
    background-color: #334155;
  }
  .calc-btn-digit:active {
    transform: scale(0.95);
  }
</style>

<!-- Decoupled Calculator Runtime (Engine, Memento, and Command Controller) -->
<script src="{% static 'js/calculator/engine.js' %}"></script>
<script src="{% static 'js/calculator/memento.js' %}"></script>
<script src="{% static 'js/calculator/controller.js' %}"></script>
