version: "1.0"
domain: "cbt_exam_workflow"
description: "Authoritative behavioral blueprint for KalmiPrep CBT Exam workflow and hidden nuances"

invariants:
  - id: "INV-CBT-01"
    name: "Authoritative Server Timer"
    rule: "Exam deadline must be computed from server-side session start and duration. Client timer is visual only and must sync or auto-submit when server time expires."
    severity: "critical"
  - id: "INV-CBT-02"
    name: "Palette State Completeness"
    rule: "Question palette must accurately reflect exactly one of 4 states: unvisited, visited_unanswered, answered, flagged. Never show stale selection."
    severity: "high"
  - id: "INV-CBT-03"
    name: "Mathematical Formula Integrity"
    rule: "Every math formula must render cleanly via KaTeX with zero .katex-error class elements or raw LaTeX delimiters visible to the candidate."
    severity: "high"
  - id: "INV-CBT-04"
    name: "Touch & Calculator Non-Interference"
    rule: "Calculator modal, formulas, and touch targets must not cause page horizontal blowout on mobile viewports (375px min width)."
    severity: "medium"
  - id: "INV-CBT-05"
    name: "State Preservation on Interruption"
    rule: "Selected answers and flagged states must be saved immediately to local storage / server and survive page reload or temporary disconnect."
    severity: "critical"

scenarios:
  - name: "Exam Start & Timer Sync"
    path: "/cbt/session/"
    prerequisites:
      authenticated: true
      role: "student"
      active_session: true
    steps:
      - action: "navigate"
        target: "/cbt/active/"
      - action: "assert_element"
        selector: "#exam-timer, [data-exam-timer]"
        attribute: "text"
        matches: "^[0-9]{1,2}:[0-9]{2}:[0-9]{2}$|^[0-9]{1,2}:[0-9]{2}$"
      - action: "assert_nuance"
        check: "server_timer_sync"
        expected: "client timer difference from server expires_at is under 2000ms"

  - name: "Palette 4-State Validation"
    path: "/cbt/active/"
    prerequisites:
      authenticated: true
      role: "student"
    steps:
      - action: "query_all"
        selector: ".palette-btn, [data-question-btn]"
        assert_count_greater_than: 0
      - action: "click"
        target: "[data-question-btn='1']"
      - action: "assert_element"
        selector: "[data-question-btn='1']"
        has_class: "ring-2 ring-primary-500, border-primary-500, active"
      - action: "click"
        target: "input[type='radio'][name='option']"
      - action: "assert_element"
        selector: "[data-question-btn='1']"
        matches_state: "answered"
      - action: "click"
        target: "#flag-question-btn, [data-action='flag']"
      - action: "assert_element"
        selector: "[data-question-btn='1']"
        matches_state: "flagged"

  - name: "KaTeX Math Invariant Check"
    path: "/cbt/active/"
    steps:
      - action: "assert_no_elements"
        selector: ".katex-error, .katex-html:empty"
      - action: "assert_no_text_regex"
        selector: ".question-body, .option-text"
        regex: "\\$\\$|\\\\\\(|\\\\\\["
      - action: "assert_nuance"
        check: "horizontal_overflow"
        target: ".katex-display, .math-container"
        expected: "scrollWidth <= clientWidth or has parent with overflow-x-auto"

  - name: "Scientific Calculator Persistence"
    path: "/cbt/active/"
    steps:
      - action: "click"
        target: "#calculator-toggle-btn, [data-action='open-calc']"
      - action: "assert_visible"
        selector: "#scientific-calc-modal, .calculator-modal"
      - action: "click"
        target: "[data-calc-key='7']"
      - action: "click"
        target: "[data-question-btn='2']"
      - action: "assert_visible"
        selector: "#scientific-calc-modal, .calculator-modal"
      - action: "assert_nuance"
        check: "calc_input_preserved"
        expected: "display value contains '7'"

  - name: "Submission Confirmation and Counts"
    path: "/cbt/active/"
    steps:
      - action: "click"
        target: "#submit-exam-btn, [data-action='submit-exam']"
      - action: "assert_visible"
        selector: "#submit-modal, [data-modal='exam-submit']"
      - action: "assert_nuance"
        check: "submission_summary_counts"
        expected: "answered + unanswered == total_questions"
