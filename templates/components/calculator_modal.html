<!-- On-Screen Scientific Calculator Modal (JAMB UTME / WAEC CBT Standard) -->
<div id="scientific-calculator-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/40 backdrop-blur-sm hidden p-0 sm:p-4 transition-opacity">
  
  <!-- Backdrop click to close -->
  <div class="fixed inset-0" onclick="useKalmiStore.getState().closeCalc()"></div>

  <!-- Calculator Window Card -->
  <div class="calc-window relative z-10 w-full sm:max-w-md bg-white dark:bg-navy-900 border-t sm:border border-slate-200 dark:border-navy-700 rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- Header Bar with Draggable Handle & Close -->
    <div class="flex items-center justify-between px-4 py-3 bg-slate-50 dark:bg-navy-950 border-b border-slate-200 dark:border-navy-800 cursor-move select-none" id="calc-header-drag">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-brand-600 text-white flex items-center justify-center text-xs font-bold shadow-sm">
          <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
        </div>
        <span class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white">Scientific Calculator</span>
        <span class="text-[10px] text-slate-500 font-mono hidden xs:inline">(Press 'C' to toggle)</span>
      </div>

      <div class="flex items-center gap-1.5">
        <button type="button" 
                id="calc-angle-mode-btn" 
                onclick="useKalmiStore.getState().setCalcAngleMode(useKalmiStore.getState().calc.angleMode === 'DEG' ? 'RAD' : 'DEG')" 
                class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-slate-200 dark:bg-navy-800 text-brand-700 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-navy-700 border border-slate-300 dark:border-navy-700 transition-colors">
          DEG
        </button>
        <button type="button" 
                onclick="useKalmiStore.getState().closeCalc()" 
                class="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-navy-800 transition-colors"
                aria-label="Close Calculator">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- LCD Display -->
    <div class="p-4 bg-slate-100/80 dark:bg-navy-950/80 border-b border-slate-200 dark:border-navy-800 space-y-1">
      <div class="flex items-center justify-between text-[11px] text-slate-500 font-mono">
        <span id="calc-memory-indicator" class="px-1 py-0.2 rounded bg-amber-500/20 text-amber-600 dark:text-amber-400 font-bold" style="display: none;">M</span>
        <div id="calc-expression-display" class="w-full text-right overflow-x-auto no-scrollbar whitespace-nowrap text-slate-500 dark:text-slate-400 font-mono min-h-[16px]">
          0
        </div>
      </div>
      <div id="calc-result-display" class="text-2xl sm:text-3xl font-bold font-mono text-slate-900 dark:text-white text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight min-h-[36px]">
        0
      </div>
    </div>

    <!-- Scientific Keypad Grid -->
    <div class="p-3 grid grid-cols-6 gap-1.5 sm:gap-2 text-xs font-semibold select-none bg-slate-50/50 dark:bg-navy-900 overflow-y-auto">
      
      <!-- Row 1: Memory & Clear -->
      <button type="button" onclick="useKalmiStore.getState().memoryClear()" class="calc-btn text-slate-500 dark:text-slate-400 bg-white dark:bg-navy-800">MC</button>
      <button type="button" onclick="useKalmiStore.getState().memoryRecall()" class="calc-btn text-slate-500 dark:text-slate-400 bg-white dark:bg-navy-800">MR</button>
      <button type="button" onclick="useKalmiStore.getState().memorySubtract()" class="calc-btn text-slate-500 dark:text-slate-400 bg-white dark:bg-navy-800">M-</button>
      <button type="button" onclick="useKalmiStore.getState().memoryAdd()" class="calc-btn text-slate-500 dark:text-slate-400 bg-white dark:bg-navy-800">M+</button>
      <button type="button" onclick="useKalmiStore.getState().backspaceCalc()" class="calc-btn text-amber-600 dark:text-amber-400 bg-white dark:bg-navy-800 flex items-center justify-center">
        <i data-lucide="delete" class="w-3.5 h-3.5"></i>
      </button>
      <button type="button" onclick="useKalmiStore.getState().clearCalc()" class="calc-btn text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 font-bold">AC</button>

      <!-- Row 2: Trig & Parentheses -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('sin(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">sin</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('cos(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">cos</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('tan(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">tan</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800">(</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc(')')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800">)</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('/')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-sm">&divide;</button>

      <!-- Row 3: Inverse Trig & Powers -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('asin(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">sin⁻¹</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('acos(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">cos⁻¹</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('atan(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">tan⁻¹</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('sqrt(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">&radic;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('^')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">xʸ</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('*')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-sm">&times;</button>

      <!-- Row 4: Log, Ln & Digits 7,8,9 -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('log(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">log</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('ln(')" class="calc-btn text-brand-700 dark:text-brand-300 bg-brand-50/50 dark:bg-navy-800">ln</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('7')" class="calc-btn-digit">7</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('8')" class="calc-btn-digit">8</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('9')" class="calc-btn-digit">9</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('-')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-sm">&minus;</button>

      <!-- Row 5: Square, Power & Digits 4,5,6 -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('^2')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">x²</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('10^(')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">10ˣ</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('4')" class="calc-btn-digit">4</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('5')" class="calc-btn-digit">5</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('6')" class="calc-btn-digit">6</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('+')" class="calc-btn text-brand-600 dark:text-brand-400 bg-white dark:bg-navy-800 font-bold text-sm">+</button>

      <!-- Row 6: Constants & Digits 1,2,3 -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('π')" class="calc-btn text-purple-600 dark:text-purple-400 bg-white dark:bg-navy-800 font-mono">&pi;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('e')" class="calc-btn text-purple-600 dark:text-purple-400 bg-white dark:bg-navy-800 font-mono">e</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('1')" class="calc-btn-digit">1</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('2')" class="calc-btn-digit">2</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('3')" class="calc-btn-digit">3</button>
      <button type="button" onclick="useKalmiStore.getState().evaluateCalc(true)" class="row-span-2 calc-btn bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-bold text-lg shadow-md shadow-brand-600/30 flex items-center justify-center">=</button>

      <!-- Row 7: Factorial, EXP, Dot & 0 -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('!')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">n!</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('e')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono" title="Scientific Exponential (e.g. 1.6e-19)">EXP</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('%')" class="calc-btn text-slate-700 dark:text-slate-200 bg-white dark:bg-navy-800 font-mono">%</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('0')" class="calc-btn-digit">0</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('.')" class="calc-btn-digit font-bold text-base">.</button>

    </div>

  </div>
</div>

<style>
  .calc-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.625rem 0.25rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(226, 232, 240, 0.8);
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 0.1s ease;
    cursor: pointer;
  }
  .dark .calc-btn {
    border-color: rgba(30, 41, 59, 0.8);
  }
  .calc-btn:active {
    transform: scale(0.96);
  }
  .calc-btn-digit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.625rem 0.25rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(226, 232, 240, 0.8);
    background-color: #ffffff;
    color: #0f172a;
    font-weight: 700;
    font-family: monospace;
    font-size: 0.95rem;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 0.1s ease;
    cursor: pointer;
  }
  .dark .calc-btn-digit {
    background-color: #1e293b;
    border-color: rgba(51, 65, 85, 0.8);
    color: #f8fafc;
  }
  .calc-btn-digit:active {
    transform: scale(0.96);
  }
</style>
