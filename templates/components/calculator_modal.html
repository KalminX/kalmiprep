{% load static %}
<!-- On-Screen Scientific Calculator Modal (Casio fx-991ES Plus Natural Textbook Display Standard) -->
<div id="scientific-calculator-modal"
     class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/65 backdrop-blur-sm hidden p-0 sm:p-4 transition-opacity select-none"
     role="dialog" aria-modal="true" aria-label="Casio Scientific Calculator" aria-hidden="true">
  
  <!-- Backdrop click to close (does not touch the exam) -->
  <div class="fixed inset-0" onclick="useKalmiStore.getState().closeCalc()" aria-hidden="true"></div>

  <!-- Calculator Window Chassis (Casio fx-991 Curved Titanium Card) -->
  <div class="calc-window relative z-10 w-full sm:max-w-md bg-slate-900 border-t sm:border border-slate-700/80 rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] select-none text-slate-100"
       style="max-width: 440px; width: 100%;">
    
    <!-- Casio Top Bezel with Branding & Solar Cell Panel -->
    <div class="flex items-center justify-between px-4 py-2.5 bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border-b border-slate-700/60">
      <div class="flex items-center gap-2">
        <span class="text-sm font-black tracking-widest font-sans text-slate-100">CASIO</span>
        <span class="text-[9px] font-bold text-amber-400 font-mono tracking-tight px-1.5 py-0.5 rounded bg-amber-500/15 border border-amber-500/30">NATURAL-V.P.A.M.</span>
        <span class="text-[10px] text-slate-400 font-mono hidden xs:inline">fx-991ES PLUS</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- Direct LaTeX Quick-Copy Tool (Discrete Utility Pill) -->
        <button type="button" 
                id="calc-copy-latex-btn"
                onclick="KalmiCalc.copyLatex()" 
                class="px-2 py-0.5 rounded text-[10px] font-mono font-medium bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center gap-1 transition-all"
                title="Copy LaTeX formula">
          <i data-lucide="copy" class="w-3 h-3"></i>
          <span>LaTeX</span>
        </button>
        <code id="calc-latex-code" class="sr-only" aria-hidden="true">0</code>

        <!-- Angle Mode Toggle (DEG / RAD) -->
        <button type="button" 
                id="calc-angle-mode-btn" 
                onclick="useKalmiStore.getState().setCalcAngleMode(useKalmiStore.getState().calc.angleMode === 'DEG' ? 'RAD' : 'DEG')" 
                class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-slate-800 hover:bg-slate-700 text-brand-400 border border-slate-700 transition-colors"
                title="Toggle Degrees / Radians">
          DEG
        </button>

        <!-- Close Button -->
        <button type="button" 
                onclick="useKalmiStore.getState().closeCalc()" 
                class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                aria-label="Close Calculator (Esc or Alt+C)"
                title="Close (Esc or Alt+C)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Casio Natural Textbook Display (Authentic Two-Line High-Contrast LCD Screen) -->
    <div class="px-3.5 py-2.5 bg-[#c2d2bc] dark:bg-[#16221c] border-y-2 border-slate-800 text-slate-900 dark:text-[#ecfdf5] shadow-inner select-none flex flex-col justify-between"
         style="min-height: 124px;">
      
      <!-- Annunciators & Status Row -->
      <div class="flex items-center justify-between text-[10px] text-slate-700 dark:text-emerald-500/80 mb-1 border-b border-slate-400/30 dark:border-emerald-950/60 pb-0.5 font-mono">
        <div class="flex items-center gap-1.5 font-bold uppercase tracking-wider text-[9px]">
          <span id="calc-m-badge" class="px-1 rounded bg-black/10 dark:bg-emerald-950/80">D</span>
          <span id="calc-memory-indicator" class="px-1 rounded bg-black/10 dark:bg-emerald-950/80 hidden">M</span>
          <span id="calc-math-badge" class="px-1 rounded bg-black/10 dark:bg-emerald-950/80 font-serif italic">Math</span>
          <span id="calc-ans-indicator" class="px-1 rounded bg-black/10 dark:bg-emerald-950/80 hidden">Ans</span>
          <span id="calc-sd-indicator" class="px-1 rounded bg-amber-500/20 text-amber-800 dark:text-amber-400 hidden">S⇔D</span>
        </div>
        <div class="text-[9px] opacity-75 font-sans font-semibold tracking-wider">NATURAL-V.P.A.M.</div>
      </div>

      <!-- Line 1: Primary Natural Textbook Expression Area (Large, Spacious Casio Display) -->
      <div id="calc-expression-display" 
           class="w-full overflow-x-auto no-scrollbar whitespace-nowrap min-h-[58px] flex items-center justify-start text-left"
           style="direction: ltr;">
        <math-field id="calc-math-field" 
                    math-virtual-keyboard-policy="manual"
                    class="w-full bg-transparent border-none outline-none text-slate-900 dark:text-[#ecfdf5]" 
                    aria-label="Mathematical Input Field">
        </math-field>
        <span id="calc-text-mirror" class="sr-only">0</span>
      </div>

      <!-- Line 2: Precision Result (Right-aligned Bottom Baseline) -->
      <div id="calc-result-display" 
           class="text-xl sm:text-2xl font-bold font-mono text-right overflow-x-auto no-scrollbar whitespace-nowrap tracking-tight min-h-[32px] flex items-center justify-end text-slate-950 dark:text-[#a0e49a] pt-1 border-t border-slate-400/20 dark:border-emerald-950/40">
        0
      </div>
    </div>

    <!-- Casio REPLAY 4-Way Directional Navigation Pad (Up, Down, Left, Right) -->
    <div class="px-3.5 py-2 bg-gradient-to-b from-slate-900 via-slate-850 to-slate-950 border-b border-slate-800 flex items-center justify-between gap-2 select-none"
         onmousedown="event.preventDefault()">
      
      <!-- Left Quick Function Buttons -->
      <div class="flex items-center gap-1.5">
        <button type="button" 
                onclick="useKalmiStore.getState().appendCalc('(')" 
                class="casio-fn-btn px-2.5 py-1 text-xs font-mono font-bold text-amber-300"
                title="Open Parenthesis (">
          (
        </button>
        <button type="button" 
                onclick="useKalmiStore.getState().appendCalc(')')" 
                class="casio-fn-btn px-2.5 py-1 text-xs font-mono font-bold text-amber-300"
                title="Close Parenthesis )">
          )
        </button>
      </div>

      <!-- Center: Iconic Casio 4-Way REPLAY Directional Cluster -->
      <div class="relative w-36 h-14 sm:w-40 sm:h-16 flex items-center justify-center">
        <!-- Oval D-Pad Chassis -->
        <div class="w-full h-full rounded-full bg-gradient-to-b from-slate-700 via-slate-800 to-slate-900 border-2 border-slate-600/80 shadow-md relative flex items-center justify-center overflow-hidden">
          
          <!-- Center REPLAY Label Badge -->
          <div class="w-14 h-5 sm:h-6 rounded-full bg-slate-950 border border-slate-700/80 flex items-center justify-center shadow-inner z-10 pointer-events-none">
            <span class="text-[8px] font-black tracking-widest text-slate-300">REPLAY</span>
          </div>

          <!-- UP Button (▲) -->
          <button type="button" 
                  id="calc-nav-up"
                  onclick="KalmiCalc.navUp()" 
                  class="absolute top-0 inset-x-0 mx-auto w-14 h-4.5 flex items-center justify-center text-slate-200 hover:text-amber-400 hover:bg-slate-700/60 transition-colors active:scale-90"
                  aria-label="Cursor Up / History Previous"
                  title="Cursor to Start / Up (ArrowUp)">
            <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
          </button>

          <!-- DOWN Button (▼) -->
          <button type="button" 
                  id="calc-nav-down"
                  onclick="KalmiCalc.navDown()" 
                  class="absolute bottom-0 inset-x-0 mx-auto w-14 h-4.5 flex items-center justify-center text-slate-200 hover:text-amber-400 hover:bg-slate-700/60 transition-colors active:scale-90"
                  aria-label="Cursor Down / History Next"
                  title="Cursor to End / Down (ArrowDown)">
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
          </button>

          <!-- LEFT Button (◄) -->
          <button type="button" 
                  id="calc-nav-left"
                  onclick="KalmiCalc.navLeft()" 
                  class="absolute left-0 inset-y-0 my-auto w-9 h-10 flex items-center justify-center text-slate-200 hover:text-amber-400 hover:bg-slate-700/60 transition-colors active:scale-90"
                  aria-label="Cursor Left"
                  title="Move Cursor Left (ArrowLeft)">
            <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          </button>

          <!-- RIGHT Button (►) -->
          <button type="button" 
                  id="calc-nav-right"
                  onclick="KalmiCalc.navRight()" 
                  class="absolute right-0 inset-y-0 my-auto w-9 h-10 flex items-center justify-center text-slate-200 hover:text-amber-400 hover:bg-slate-700/60 transition-colors active:scale-90"
                  aria-label="Cursor Right"
                  title="Move Cursor Right (ArrowRight)">
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Right Quick Actions -->
      <div class="flex items-center gap-1.5">
        <button type="button" 
                id="calc-nav-mode-btn" 
                onclick="useKalmiStore.getState().toggleCalcAngleMode()" 
                class="casio-fn-btn px-2.5 py-1 text-xs font-mono font-bold text-sky-400"
                title="Toggle Angle Mode (DEG / RAD)">
          MODE
        </button>
      </div>

    </div>

    <!-- Casio Tactile Keypad (Dual-Tone Accessible Touch Targets) -->
    <div class="p-2.5 sm:p-3 grid grid-cols-6 gap-1.5 text-xs font-semibold select-none bg-slate-900/95 overflow-y-auto"
         onmousedown="event.preventDefault()">
      
      <!-- Row 1: Memory & Clear Row -->
      <button type="button" onclick="useKalmiStore.getState().memoryClear()" class="casio-fn-btn" title="Memory Clear">MC</button>
      <button type="button" onclick="useKalmiStore.getState().memoryRecall()" class="casio-fn-btn" title="Memory Recall">MR</button>
      <button type="button" onclick="useKalmiStore.getState().memorySubtract()" class="casio-fn-btn" title="Memory Subtract">M&minus;</button>
      <button type="button" onclick="useKalmiStore.getState().memoryAdd()" class="casio-fn-btn" title="Memory Add">M+</button>
      <button type="button" onclick="useKalmiStore.getState().backspaceCalc()" class="casio-del-btn" title="Backspace (DEL)">DEL</button>
      <button type="button" onclick="useKalmiStore.getState().clearCalc()" class="casio-ac-btn" title="All Clear (AC)">AC</button>

      <!-- Row 2: Scientific Functions & Roots -->
      <button type="button" onclick="KalmiCalc.insertTemplate('fraction')" class="casio-fn-btn font-mono" title="Stacked Fraction (■/□)">&#9632;/&#9633;</button>
      <button type="button" onclick="KalmiCalc.insertTemplate('sqrt')" class="casio-fn-btn font-mono" title="Square Root (&radic;&Box;)">&radic;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('^2')" class="casio-fn-btn font-mono" title="Square (x²)">x&sup2;</button>
      <button type="button" onclick="KalmiCalc.insertTemplate('power')" class="casio-fn-btn font-mono" title="Power (x^&Box;)">x&#739;</button>
      <button type="button" onclick="KalmiCalc.insertTemplate('logbase')" class="casio-fn-btn font-mono text-[10px]" title="Logarithm with Base (log_b(x))">log&#9633;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('ln(')" class="casio-fn-btn font-mono" title="Natural Logarithm (ln)">ln</button>

      <!-- Row 3: Nth Root, Negative & Trigonometry -->
      <button type="button" onclick="KalmiCalc.insertTemplate('nthroot')" class="casio-fn-btn font-mono text-[10px]" title="General Nth Root (ʸ&radic;x)">&#739;&radic;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('log(')" class="casio-fn-btn font-mono" title="Common Logarithm (log10)">log</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&minus;')" class="casio-fn-btn font-mono" title="Negative Sign (-)">(-)</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('sin(')" class="casio-fn-btn font-mono">sin</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('cos(')" class="casio-fn-btn font-mono">cos</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('tan(')" class="casio-fn-btn font-mono">tan</button>

      <!-- Row 4: Absolute Value, Parentheses, S<=>D & Combinatorics -->
      <button type="button" onclick="KalmiCalc.insertTemplate('abs')" class="casio-fn-btn font-mono text-[11px]" title="Absolute Value (|x|)">|x|</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('(')" class="casio-fn-btn font-bold text-sm">(</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc(')')" class="casio-fn-btn font-bold text-sm">)</button>
      <button type="button" id="calc-sd-btn" onclick="useKalmiStore.getState().toggleCalcFraction()" class="casio-fn-btn text-amber-400 font-mono text-[11px] font-bold" title="Toggle Fraction / Decimal (S<=>D)">S&hArr;D</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('nPr')" class="casio-fn-btn font-mono text-[11px]" title="Permutations (nPr)">nPr</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&divide;')" class="casio-op-btn" title="Division (&divide;)">&divide;</button>

      <!-- Row 5: Digits 7, 8, 9, Factorial, Combinations & Multiplication -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('7')" class="casio-digit-btn">7</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('8')" class="casio-digit-btn">8</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('9')" class="casio-digit-btn">9</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('!')" class="casio-fn-btn font-mono" title="Factorial (n!)">n!</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('nCr')" class="casio-fn-btn font-mono text-[11px]" title="Combinations (nCr)">nCr</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&times;')" class="casio-op-btn" title="Multiplication (&times;)">&times;</button>

      <!-- Row 6: Digits 4, 5, 6, Percent, Pi & Subtraction -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('4')" class="casio-digit-btn">4</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('5')" class="casio-digit-btn">5</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('6')" class="casio-digit-btn">6</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('%')" class="casio-fn-btn font-mono" title="Percent (%)">%</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&pi;')" class="casio-fn-btn font-mono text-purple-400">&pi;</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('&minus;')" class="casio-op-btn" title="Subtraction (&minus;)">&minus;</button>

      <!-- Row 7: Digits 1, 2, 3 & Addition -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('1')" class="casio-digit-btn">1</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('2')" class="casio-digit-btn">2</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('3')" class="casio-digit-btn">3</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('e')" class="casio-fn-btn font-mono text-purple-400">e</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('EXP')" class="casio-fn-btn font-mono text-[10px]" title="Scientific Exponential (e.g. 1.6 &times; 10^-19)">EXP</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('+')" class="casio-op-btn" title="Addition (+)">+</button>

      <!-- Row 8: Digit 0, Dot, Ans & Equals -->
      <button type="button" onclick="useKalmiStore.getState().appendCalc('0')" class="casio-digit-btn col-span-2 text-left px-4">0</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('.')" class="casio-digit-btn font-bold text-base">.</button>
      <button type="button" onclick="useKalmiStore.getState().appendCalc('Ans')" class="casio-fn-btn font-mono font-bold" title="Previous Answer">Ans</button>
      <button type="button" onclick="useKalmiStore.getState().evaluateCalc(true)" class="casio-equal-btn col-span-2" title="Equals (=)">=</button>

    </div>
  </div>
</div>

<style>
  /* Casio fx-991 Style Tactile Keypad Styling */
  .casio-fn-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 38px;
    border-radius: 0.5rem;
    background-color: #1e293b;
    border: 1px solid #334155;
    color: #e2e8f0;
    box-shadow: 0 2px 0 0 #0f172a;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-fn-btn:hover {
    background-color: #334155;
    color: #ffffff;
  }
  .casio-fn-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #0f172a;
  }

  .casio-digit-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 40px;
    border-radius: 0.5rem;
    background-color: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    font-weight: 800;
    font-family: monospace;
    font-size: 1.15rem;
    box-shadow: 0 2px 0 0 #94a3b8;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-digit-btn:hover {
    background-color: #ffffff;
    filter: brightness(1.05);
  }
  .casio-digit-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #94a3b8;
  }

  .casio-del-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 38px;
    border-radius: 0.5rem;
    background-color: #d97706;
    border: 1px solid #b45309;
    color: #ffffff;
    font-weight: 800;
    font-size: 0.8rem;
    box-shadow: 0 2px 0 0 #78350f;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-del-btn:hover {
    background-color: #f59e0b;
  }
  .casio-del-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #78350f;
  }

  .casio-ac-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 38px;
    border-radius: 0.5rem;
    background-color: #dc2626;
    border: 1px solid #b91c1c;
    color: #ffffff;
    font-weight: 800;
    font-size: 0.8rem;
    box-shadow: 0 2px 0 0 #7f1d1d;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-ac-btn:hover {
    background-color: #ef4444;
  }
  .casio-ac-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #7f1d1d;
  }

  .casio-op-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 40px;
    border-radius: 0.5rem;
    background-color: #3b82f6;
    border: 1px solid #2563eb;
    color: #ffffff;
    font-weight: 800;
    font-size: 1.2rem;
    box-shadow: 0 2px 0 0 #1d4ed8;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-op-btn:hover {
    background-color: #60a5fa;
  }
  .casio-op-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #1d4ed8;
  }

  .casio-equal-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.2rem;
    min-height: 40px;
    border-radius: 0.5rem;
    background-color: #10b981;
    border: 1px solid #059669;
    color: #ffffff;
    font-weight: 900;
    font-size: 1.3rem;
    box-shadow: 0 2px 0 0 #047857;
    transition: all 0.05s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .casio-equal-btn:hover {
    background-color: #34d399;
  }
  .casio-equal-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 0 #047857;
  }

  /* MathLive Custom Casio Natural Display Styling */
  math-field {
    background-color: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    color: #0f172a !important;
    --color: #0f172a !important;
    --caret-color: #0f172a !important;
    --placeholder-color: #334155 !important;
    --placeholder-opacity: 0.65 !important;
    font-family: KaTeX_Main, KaTeX_Math, 'Times New Roman', serif !important;
    font-size: 1.55rem !important;
    line-height: 2.2rem !important;
    padding: 2px 4px !important;
    margin: 0 !important;
    width: 100% !important;
    min-height: 58px !important;
    text-align: left !important;
    direction: ltr !important;
    display: block !important;
  }
  .dark math-field {
    color: #ecfdf5 !important;
    --color: #ecfdf5 !important;
    --caret-color: #a7f3d0 !important;
    --placeholder-color: #6ee7b7 !important;
    --placeholder-opacity: 0.55 !important;
  }
  math-field:focus,
  math-field:focus-within {
    outline: none !important;
    border: none !important;
    box-shadow: none !important;
  }
  math-field::part(virtual-keyboard-toggle),
  math-field::part(menu-toggle) {
    display: none !important;
    visibility: hidden !important;
    width: 0 !important;
    height: 0 !important;
    pointer-events: none !important;
  }

  /* Blinking Natural Textbook Input Cursor */
  .calc-cursor {
    display: inline-block;
    width: 2px;
    height: 1.15em;
    background-color: currentColor;
    margin: 0 1.5px;
    vertical-align: text-bottom;
    animation: calc-blink 0.9s steps(1) infinite;
  }
  @keyframes calc-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>

<!-- Decoupled Casio Calculator Runtime (MathLive, Nerdamer, AST, Converter, Validator, Formatter, Engine, Memento, and Command Controller) -->
<link rel="stylesheet" href="{% static 'vendor/mathlive/mathlive-fonts.css' %}">
